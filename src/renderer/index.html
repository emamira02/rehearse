<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The page loads only local files and may not open network connections (the main process also cancels any
       http/ws request). worker-src blob: is required by the SmartSpectra renderer module. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; worker-src 'self' blob:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rehearse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header" class="header"></header>
  <main id="view" class="view"></main>
  <script src="../../dist/renderer.js"></script>
</body>
</html>
